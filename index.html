<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyFlow | Study Planner</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#e8eefb;background:#0b1220}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#1b2b4a,#0b1220 55%);min-height:100vh}.wrap{max-width:1000px;margin:auto;padding:38px 20px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}h1{font-size:2rem;margin:0}h2{font-size:1.15rem;margin:0 0 18px}.sub,.muted{color:#a6b5cc}.sub{margin-top:8px}.pill{padding:9px 14px;border-radius:50px;background:#19385a;color:#90d9ff;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:20px}.card{background:#151f31;border:1px solid #2a3850;border-radius:18px;padding:24px;box-shadow:0 15px 40px #0002}label{display:block;margin:14px 0 7px;color:#cbd7e9;font-size:14px}input,select{width:100%;padding:12px 13px;border-radius:9px;border:1px solid #40516b;background:#0e192a;color:white;font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:12px 16px;background:#6a9cff;color:#071325;font-weight:750;font:inherit;font-weight:700}button:hover{filter:brightness(1.12)}.add{width:100%;margin-top:20px}.stat{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.percent{font-size:2rem;font-weight:800;color:#8db7ff}.bar{height:12px;border-radius:20px;background:#283850;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#6292ff,#56e2bb);width:0;transition:width .2s}.list{margin-top:20px}.task{display:flex;align-items:center;gap:12px;background:#101b2c;border:1px solid #2c3b52;border-radius:12px;padding:14px;margin:10px 0}.task input{width:18px;height:18px;accent-color:#62dcb4}.taskmain{flex:1;min-width:0}.taskname{font-weight:700;overflow-wrap:anywhere}.taskmeta{color:#9eafc8;font-size:12px;margin-top:5px}.done .taskname{text-decoration:line-through;color:#8998ac}.delete{background:#392a36;color:#ff9aa9;padding:8px 11px}.urgent{color:#ffac86}.empty{color:#91a5c2;text-align:center;padding:35px 10px}.foot{margin-top:20px;color:#8091aa;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><header><div><h1>StudyFlow <span style="color:#78a8ff">✦</span></h1><p class="sub">Plan smarter. Stay on track.</p></div><span class="pill">Your personal study dashboard</span></header><div class="grid"><section class="card"><h2>Add a study task</h2><form id="form"><label for="title">Task name</label><input id="title" placeholder="e.g. Finish AI assignment" required maxlength="100"><label for="subject">Subject</label><input id="subject" placeholder="e.g. Introduction to AI" required maxlength="60"><label for="due">Due date</label><input id="due" type="date" required><button class="add" type="submit">+ Add task</button></form></section><section class="card"><h2>Study overview</h2><div class="stat"><div><div class="muted">Completed tasks</div><div id="count" style="font-size:21px;font-weight:750;margin-top:7px">0 of 0</div></div><div id="percent" class="percent">0%</div></div><div class="bar"><div class="fill" id="fill"></div></div><div class="list"><h2 style="margin-top:28px">Your tasks</h2><div id="tasks"></div></div></section></div><div class="foot">Tasks are saved in this browser using localStorage. No account required.</div></main><script>
const key='studyflow_tasks_v1';let tasks=[];try{const saved=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(saved))tasks=saved;}catch(e){}const $=id=>document.getElementById(id);$('due').min=new Date().toLocaleDateString('en-CA');function save(){localStorage.setItem(key,JSON.stringify(tasks));render()}function dateText(d){return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}function render(){const done=tasks.filter(t=>t.done).length;const percent=tasks.length?Math.round(done/tasks.length*100):0;$('count').textContent=`${done} of ${tasks.length}`;$('percent').textContent=percent+'%';$('fill').style.width=percent+'%';const target=$('tasks');target.replaceChildren();if(!tasks.length){const e=document.createElement('div');e.className='empty';e.textContent='No tasks yet. Add your first task!';target.append(e);return}const sorted=[...tasks].sort((a,b)=>Number(a.done)-Number(b.done)||a.due.localeCompare(b.due));for(const t of sorted){const row=document.createElement('div');row.className='task'+(t.done?' done':'');const check=document.createElement('input');check.type='checkbox';check.checked=t.done;check.setAttribute('aria-label','Mark '+t.title+' complete');check.addEventListener('change',()=>{t.done=check.checked;save()});const main=document.createElement('div');main.className='taskmain';const name=document.createElement('div');name.className='taskname';name.textContent=t.title;const meta=document.createElement('div');meta.className='taskmeta';const overdue=!t.done&&t.due<new Date().toLocaleDateString('en-CA');meta.textContent=t.subject+' · Due '+dateText(t.due)+(overdue?' · Overdue':'');if(overdue)meta.classList.add('urgent');main.append(name,meta);const del=document.createElement('button');del.className='delete';del.textContent='Delete';del.setAttribute('aria-label','Delete '+t.title);del.addEventListener('click',()=>{tasks=tasks.filter(x=>x.id!==t.id);save()});row.append(check,main,del);target.append(row)}}$('form').addEventListener('submit',e=>{e.preventDefault();tasks.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),title:$('title').value.trim(),subject:$('subject').value.trim(),due:$('due').value,done:false});$('form').reset();save()});render();
</script></body></html>
